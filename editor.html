<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor GeoJSON Reserva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root { --bg:#070b10; --panel:#0b1118; --panel2:#101720; --line:rgba(148,163,184,.22); --text:#e5edf7; --muted:#8ea0b5; --muted2:#65758a; --green:#18c964; --green2:#0f9f4d; --red:#ef4444; --blue:#3b82f6; }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:"Space Grotesk",system-ui,sans-serif} button,input,textarea{font:inherit}
    .shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.top{padding:16px 18px;border-bottom:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand p{margin:0 0 5px;color:var(--green);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.14em}.brand h1{margin:0;font-size:18px;line-height:1.1}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 12px;border-radius:3px;cursor:pointer;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;text-decoration:none;display:inline-flex;align-items:center;gap:8px}.btn.primary{background:var(--green);border-color:var(--green);color:#04110a}.btn.primary:hover{background:var(--green2);border-color:var(--green2);color:#fff}.btn.danger{border-color:rgba(239,68,68,.55);color:#fecaca}.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:2px}.layout{display:grid;grid-template-columns:340px 1fr;min-height:0}.side{border-right:1px solid var(--line);background:var(--panel);min-height:0;display:grid;grid-template-rows:auto auto 1fr}.loadbox{padding:14px;border-bottom:1px solid var(--line)}.file-label{display:block;border:1px dashed var(--line);padding:14px;background:#0f1722;cursor:pointer;text-align:center}.file-label strong{display:block;color:var(--green);font-size:13px}.file-label span{display:block;color:var(--muted);font-size:11px;margin-top:6px}#file-input{display:none}.status{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.4}.search{padding:12px;border-bottom:1px solid var(--line)}.search input{width:100%;background:#141c26;color:var(--text);border:1px solid var(--line);padding:11px;border-radius:3px}.list{overflow:auto}.item{width:100%;text-align:left;background:transparent;color:var(--text);border:0;border-bottom:1px solid var(--line);padding:12px;cursor:pointer}.item:hover,.item.active{background:#141c26}.item small{display:block;color:var(--muted);margin-top:5px}.item .tag{display:inline-block;margin-top:7px;color:#bfdbfe;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.editor{padding:18px;overflow:auto}.empty{border:1px solid var(--line);background:var(--panel);padding:24px;max-width:680px}.empty h2{margin:0 0 8px;font-size:18px}.empty p{margin:0;color:var(--muted);line-height:1.5}.form{max-width:860px}.section-title{font-size:12px;color:var(--green);text-transform:uppercase;letter-spacing:.12em;margin:0 0 12px}.field{margin-bottom:14px}.field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:6px}.field input,.field textarea{width:100%;background:#101720;color:var(--text);border:1px solid var(--line);border-radius:3px;padding:11px}.field textarea{min-height:110px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.photos{border:1px solid var(--line);background:var(--panel);padding:14px;margin-top:16px}.photo-row{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:10px}.warn{color:#fecaca;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.35);padding:10px;margin-top:10px;font-size:12px;display:none}.ok{color:#bbf7d0;background:rgba(24,201,100,.08);border:1px solid rgba(24,201,100,.35);padding:10px;margin-top:10px;font-size:12px;display:none}@media(max-width:820px){.layout{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);max-height:55vh}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand"><p>Reserva Natural</p><h1>Editor de rutas y puntos</h1></div>
      <div class="actions">
        <a class="btn" href="./index.html"><i class="fa-solid fa-map"></i> Volver al mapa</a>
        <button class="btn primary" id="download-btn" type="button" disabled><i class="fa-solid fa-download"></i> Descargar actualizado</button>
      </div>
    </header>
    <main class="layout">
      <aside class="side">
        <div class="loadbox">
          <label class="file-label" for="file-input"><strong><i class="fa-solid fa-file-arrow-up"></i> Cargar GeoJSON</strong><span>Selecciona rutas-reserva.geojson desde tu computadora</span></label>
          <input id="file-input" type="file" accept=".geojson,.json,application/geo+json,application/json" />
          <div class="status" id="status">No hay archivo cargado.</div>
          <div class="warn" id="error-box"></div><div class="ok" id="ok-box"></div>
        </div>
        <div class="search"><input id="search" type="search" placeholder="Buscar título, nombre o descripción..." disabled /></div>
        <div class="list" id="feature-list"></div>
      </aside>
      <section class="editor" id="editor-panel">
        <div class="empty"><h2>Carga tu archivo para empezar</h2><p>Haz clic en <strong>Cargar GeoJSON</strong>, selecciona <strong>rutas-reserva.geojson</strong> y luego aparecerá aquí la lista de senderos y puntos editables.</p></div>
      </section>
    </main>
  </div>
<script>
let geojson=null;let editable=[];let selected=0;
const input=document.getElementById('file-input'), list=document.getElementById('feature-list'), panel=document.getElementById('editor-panel'), statusEl=document.getElementById('status'), search=document.getElementById('search'), download=document.getElementById('download-btn'), err=document.getElementById('error-box'), ok=document.getElementById('ok-box');
input.addEventListener('change',handleFile);search.addEventListener('input',renderList);download.addEventListener('click',downloadGeojson);
function showError(msg){err.textContent=msg;err.style.display='block';ok.style.display='none'}function showOk(msg){ok.textContent=msg;ok.style.display='block';err.style.display='none'}
function handleFile(e){const file=e.target.files&&e.target.files[0]; if(!file){return} const reader=new FileReader(); reader.onload=function(){try{geojson=JSON.parse(reader.result); if(!geojson || !Array.isArray(geojson.features)){throw new Error('El archivo no tiene un arreglo features válido.')} editable=geojson.features.map((feature,index)=>({feature,index})).filter(({feature})=>feature&&feature.geometry&&feature.properties&&feature.properties.deleted!==true); selected=0; search.disabled=false; download.disabled=false; statusEl.textContent=file.name+' cargado: '+editable.length+' elementos encontrados.'; showOk('Archivo cargado correctamente. Selecciona un elemento de la lista para editarlo.'); renderList(); renderEditor();}catch(ex){showError('No pude leer el GeoJSON: '+ex.message); statusEl.textContent='Error al cargar el archivo.';}}; reader.onerror=function(){showError('El navegador no pudo leer el archivo seleccionado.');}; reader.readAsText(file);}
function titleOf(feature){const p=feature.properties||{};return p.title||p.name||p.id||feature.id||'Sin nombre'}function typeOf(feature){const t=feature.geometry&&feature.geometry.type;return (t==='LineString'||t==='MultiLineString')?'Sendero / Transecto':(t==='Point'?'Punto':'Otro')}
function renderList(){if(!geojson){list.innerHTML='';return} const q=search.value.trim().toLowerCase(); const items=editable.filter(({feature})=>{const p=feature.properties||{};return !q||JSON.stringify(p).toLowerCase().includes(q)||titleOf(feature).toLowerCase().includes(q)}); if(!items.length){list.innerHTML='<div class="item">No hay resultados.</div>';return} list.innerHTML=''; items.forEach(({feature,index})=>{const btn=document.createElement('button');btn.type='button';btn.className='item '+(index===selected?'active':'');btn.innerHTML='<strong>'+esc(titleOf(feature))+'</strong><small>'+esc(typeOf(feature))+'</small><span class="tag">Elemento '+(index+1)+'</span>';btn.onclick=()=>{selected=index;renderList();renderEditor();};list.appendChild(btn);});}
function renderEditor(){if(!geojson||!editable.length){return} const feature=geojson.features[selected]; const p=feature.properties||(feature.properties={}); const photos=Array.isArray(p.photos)?p.photos:[]; panel.innerHTML='<div class="form"><p class="section-title">Editando elemento '+(selected+1)+'</p><div class="grid"><div class="field"><label>Título</label><input id="f-title" value="'+attr(p.title||p.name||'')+'"></div><div class="field"><label>Color de ruta</label><input id="f-color" value="'+attr(p.hexcolor||p.stroke||'')+'" placeholder="#18c964"></div></div><div class="field"><label>Descripción / notas</label><textarea id="f-notes">'+esc(p.notes||p.description||'')+'</textarea></div><div class="grid"><div class="field"><label>Elevación</label><input id="f-elevation" value="'+attr(p.elevation||'')+'"></div><div class="field"><label>Ocultar del mapa</label><select id="f-deleted" style="width:100%;background:#101720;color:#e5edf7;border:1px solid rgba(148,163,184,.22);border-radius:3px;padding:11px"><option value="false">No</option><option value="true" '+(p.deleted===true?'selected':'')+'>Sí</option></select></div></div><div class="photos"><p class="section-title">Fotos</p><div id="photos-list"></div><button class="btn" type="button" id="add-photo"><i class="fa-solid fa-plus"></i> Agregar foto</button></div></div>'; document.getElementById('f-title').oninput=e=>{p.title=e.target.value;p.name=e.target.value;renderList();}; document.getElementById('f-color').oninput=e=>{p.hexcolor=e.target.value}; document.getElementById('f-notes').oninput=e=>{p.notes=e.target.value;p.description=e.target.value}; document.getElementById('f-elevation').oninput=e=>{p.elevation=e.target.value}; document.getElementById('f-deleted').onchange=e=>{p.deleted=e.target.value==='true'}; document.getElementById('add-photo').onclick=()=>{if(!Array.isArray(p.photos))p.photos=[];p.photos.push({title:titleOf(feature),web_url:'',notes:''});renderEditor();}; renderPhotos(photos,p);}
function renderPhotos(photos,p){const box=document.getElementById('photos-list'); if(!box)return; if(!Array.isArray(p.photos))p.photos=[]; box.innerHTML=''; p.photos.forEach((photo,i)=>{const row=document.createElement('div');row.className='photo-row';row.innerHTML='<input value="'+attr(photo.web_url||photo.url||photo.scaled_url||'')+'" placeholder="URL RAW de GitHub de la foto"><button class="btn danger" type="button">Eliminar</button>';row.querySelector('input').oninput=e=>{photo.web_url=e.target.value;photo.url=e.target.value};row.querySelector('button').onclick=()=>{p.photos.splice(i,1);renderEditor();};box.appendChild(row);});}
function downloadGeojson(){if(!geojson)return; const blob=new Blob([JSON.stringify(geojson,null,2)],{type:'application/geo+json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='rutas-reserva.geojson'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href); showOk('Descargado como rutas-reserva.geojson. Ahora súbelo a GitHub reemplazando el anterior.');}
function esc(v){return String(v??'').replaceAll('&','&').replaceAll('<','<').replaceAll('>','>').replaceAll('"','"').replaceAll("'",''')}function attr(v){return esc(v).replaceAll('`','`')}
</script>
</body>
</html>
