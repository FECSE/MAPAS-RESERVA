<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor GeoJSON Reserva</title>
<style>
  :root{
    --bg:#0a0f18;
    --panel:#0d1420;
    --panel-alt:#0b1017;
    --border:rgba(148,163,184,0.15);
    --text:#e5edf7;
    --text-dim:#8ea0b5;
    --green:#22c55e;
    --purple:#8b5cf6;
    --teal:#06b6d4;
    --blue:#3b82f6;
    --orange:#f59e0b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 24px;
    background:var(--panel-alt);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-icon{
    width:32px;height:32px;border-radius:8px;
    background:linear-gradient(135deg,var(--green),#0f9f4d);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
  }
  .brand-text .label{
    font-size:11px;letter-spacing:.08em;color:var(--green);
    font-weight:700;text-transform:uppercase;
  }
  .brand-text h1{margin:2px 0 0;font-size:17px;color:#fff;}
  .stats{display:flex;gap:28px;}
  .stat{text-align:center;}
  .stat .num{font-size:18px;font-weight:700;color:#fff;}
  .stat .cap{font-size:10px;color:var(--text-dim);letter-spacing:.06em;text-transform:uppercase;}
  .editor-tag{color:var(--purple);font-weight:700;font-size:13px;}

  main{
    display:grid;
    grid-template-columns:320px 1fr;
    height:calc(100vh - 65px);
  }
  aside{
    border-right:1px solid var(--border);
    overflow-y:auto;
    background:var(--panel);
    display:flex;flex-direction:column;
  }
  .side-top{padding:16px;border-bottom:1px solid var(--border);}
  .side-top p{color:var(--text-dim);font-size:12px;margin:4px 0 14px;}

  button, label.file-label{
    display:block;width:100%;padding:11px;margin:8px 0;
    background:var(--green);color:#04110a;border:none;cursor:pointer;
    font-weight:700;text-align:center;border-radius:6px;font-size:13px;
    transition:background .15s, color .15s;
  }
  button:hover, label.file-label:hover{background:#0f9f4d;color:#fff;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  input[type="file"]{display:none;}

  .search{
    width:100%;padding:10px 12px;background:var(--panel-alt);
    border:1px solid var(--border);border-radius:6px;color:var(--text);
    font-size:13px;margin-top:4px;
  }

  .status{padding:12px 16px;color:var(--text-dim);font-size:13px;}
  .error{margin:0 16px;padding:10px 12px;border-radius:6px;color:#fecaca;background:rgba(239,68,68,.12);display:none;font-size:13px;}
  .success{margin:0 16px 10px;padding:10px 12px;border-radius:6px;color:#bbf7d0;background:rgba(34,197,94,.12);display:none;font-size:13px;}

  .list-header{
    padding:12px 16px 0;font-size:11px;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:.06em;
  }
  #list{flex:1;overflow-y:auto;}
  .item{
    display:flex;align-items:center;gap:10px;
    padding:12px 16px;border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .item:hover{background:#141c26;}
  .item.active{background:#182230;border-left:4px solid var(--green);padding-left:12px;}
  .badge{
    width:26px;height:26px;border-radius:6px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;
  }
  .item-info .title{font-size:13px;font-weight:600;color:#fff;}
  .item-info .meta{font-size:11px;color:var(--text-dim);margin-top:2px;}

  section{padding:24px;overflow-y:auto;background:var(--bg);}
  section h2{margin-top:0;font-size:18px;color:#fff;}
  section p{color:var(--text-dim);font-size:13px;}

  .field-label{
    display:block;font-size:12px;color:var(--text-dim);
    margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;
  }
  input.field, textarea.field{
    width:100%;box-sizing:border-box;margin-bottom:16px;padding:10px 12px;
    background:var(--panel-alt);color:var(--text);
    border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;
  }
  textarea.field{min-height:100px;resize:vertical;}
  .save-btn{max-width:220px;}

  .upload-row{
    display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;
  }
  .upload-label{
    display:inline-block;width:auto;padding:9px 14px;margin:0;
    background:var(--purple);color:#fff;font-size:12px;
  }
  .upload-label:hover{background:#7c3aed;color:#fff;}

  .photo-grid{
    display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;
  }
  .photo-thumb{
    position:relative;width:84px;height:84px;border-radius:6px;
    overflow:hidden;border:1px solid var(--border);background:#000;
  }
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb .remove-btn{
    position:absolute;top:2px;right:2px;width:20px;height:20px;
    border-radius:50%;background:rgba(0,0,0,.65);color:#fecaca;
    font-size:12px;line-height:20px;text-align:center;cursor:pointer;
    font-weight:700;
  }
  .photo-thumb .remove-btn:hover{background:#ef4444;color:#fff;}
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">🌿</div>
      <div class="brand-text">
        <div class="label">Reserva Natural</div>
        <h1>Editor de Rutas y Transectos</h1>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="num" id="statTotal">0</div><div class="cap">Elementos</div></div>
      <div class="stat"><div class="num" id="statVisible">0</div><div class="cap">Editables</div></div>
      <div class="stat"><div class="num" id="statPhotos">0</div><div class="cap">Fotos</div></div>
    </div>
    <div class="editor-tag">✏ Editor</div>
  </header>

  <main>
    <aside>
      <div class="side-top">
        <button id="autoLoadBtn">Cargar rutas-reserva.geojson</button>
        <label class="file-label" for="fileInput">Cargar archivo manual</label>
        <input id="fileInput" type="file" accept=".geojson,.json">
        <button id="downloadBtn" disabled>Descargar actualizado</button>
        <input class="search" id="searchInput" placeholder="Buscar ruta o punto...">
      </div>

      <div id="status" class="status">Esperando archivo...</div>
      <div id="error" class="error"></div>
      <div id="success" class="success"></div>

      <div class="list-header">Senderos</div>
      <div id="list"></div>
    </aside>

    <section id="editor">
      <h2>Carga el GeoJSON para empezar</h2>
      <p>Usa el botón automático o carga manualmente el archivo <strong>rutas-reserva.geojson</strong>.</p>
    </section>
  </main>

  <script>
    let geojson = null;
    let selectedIndex = null;
    let searchTerm = "";
    let currentPhotos = [];

    const autoLoadBtn = document.getElementById("autoLoadBtn");
    const fileInput = document.getElementById("fileInput");
    const downloadBtn = document.getElementById("downloadBtn");
    const statusBox = document.getElementById("status");
    const errorBox = document.getElementById("error");
    const successBox = document.getElementById("success");
    const listBox = document.getElementById("list");
    const editorBox = document.getElementById("editor");
    const searchInput = document.getElementById("searchInput");

    const statTotal = document.getElementById("statTotal");
    const statVisible = document.getElementById("statVisible");
    const statPhotos = document.getElementById("statPhotos");

    const BADGE_COLORS = ["#22c55e", "#8b5cf6", "#06b6d4", "#3b82f6", "#f59e0b"];

    function showError(message) {
      errorBox.style.display = "block";
      successBox.style.display = "none";
      errorBox.textContent = message;
    }

    function showSuccess(message) {
      successBox.style.display = "block";
      errorBox.style.display = "none";
      successBox.textContent = message;
    }

    function getTitle(feature) {
      const p = feature.properties || {};
      return p.title || p.name || p.Name || feature.id || "Sin nombre";
    }

    function getDescription(feature) {
      const p = feature.properties || {};
      return p.description || p.notes || p.desc || "";
    }

    function isCamera(feature) {
      const p = feature.properties || {};
      const text = JSON.stringify(p).toLowerCase();
      return text.includes("cámara") || text.includes("camara") || text.includes("camera");
    }

    function getPhotoCount(feature) {
      const p = feature.properties || {};
      return Array.isArray(p.photos) ? p.photos.length : 0;
    }

    function updateStats() {
      if (!geojson) {
        statTotal.textContent = "0";
        statVisible.textContent = "0";
        statPhotos.textContent = "0";
        return;
      }
      const editable = geojson.features.filter(f => !isCamera(f));
      const totalPhotos = geojson.features.reduce((sum, f) => sum + getPhotoCount(f), 0);
      statTotal.textContent = geojson.features.length;
      statVisible.textContent = editable.length;
      statPhotos.textContent = totalPhotos;
    }

    function loadGeoJSON(data) {
      if (!data || data.type !== "FeatureCollection" || !Array.isArray(data.features)) {
        showError("El archivo no parece ser un GeoJSON FeatureCollection válido.");
        return;
      }

      geojson = data;
      selectedIndex = null;

      const editable = geojson.features.filter(feature => !isCamera(feature));

      statusBox.textContent = "GeoJSON cargado. Elementos totales: " + geojson.features.length + ". Elementos visibles/editables: " + editable.length + ".";
      downloadBtn.disabled = false;

      updateStats();
      renderList();
      showSuccess("Archivo cargado correctamente.");
    }

    function renderList() {
      listBox.innerHTML = "";

      if (!geojson) return;

      geojson.features.forEach((feature, index) => {
        if (isCamera(feature)) return;

        const title = getTitle(feature);
        if (searchTerm && !title.toLowerCase().includes(searchTerm)) return;

        const item = document.createElement("div");
        item.className = "item" + (index === selectedIndex ? " active" : "");

        const badge = document.createElement("div");
        badge.className = "badge";
        badge.style.background = BADGE_COLORS[index % BADGE_COLORS.length];
        badge.textContent = "⛰";

        const info = document.createElement("div");
        info.className = "item-info";
        const titleEl = document.createElement("div");
        titleEl.className = "title";
        titleEl.textContent = title;
        const metaEl = document.createElement("div");
        metaEl.className = "meta";
        const photoCount = getPhotoCount(feature);
        metaEl.textContent = "Ruta / Transecto" + (photoCount ? " · " + photoCount + " fotos" : "");
        info.appendChild(titleEl);
        info.appendChild(metaEl);

        item.appendChild(badge);
        item.appendChild(info);

        item.addEventListener("click", function () {
          selectedIndex = index;
          renderList();
          renderEditor();
        });

        listBox.appendChild(item);
      });
    }

    // currentPhotos: array de objetos {title, web_url, url, scaled_url?}
    function getPhotosArray(properties) {
      if (!Array.isArray(properties.photos)) return [];
      return properties.photos.map(photo => {
        if (typeof photo === "string") {
          return { title: "", web_url: photo, url: photo };
        }
        return { ...photo };
      }).filter(photo => photo.web_url || photo.url || photo.scaled_url);
    }

    function renderEditor() {
      if (selectedIndex === null || !geojson) {
        editorBox.innerHTML = "<h2>Selecciona un elemento</h2>";
        return;
      }

      const feature = geojson.features[selectedIndex];
      const p = feature.properties || {};
      feature.properties = p;

      currentPhotos = getPhotosArray(p);

      editorBox.innerHTML = `
        <h2>Editar elemento</h2>

        <label class="field-label">Título</label>
        <input class="field" id="titleInput" value="${escapeHtml(getTitle(feature))}">

        <label class="field-label">Descripción</label>
        <textarea class="field" id="descriptionInput">${escapeHtml(getDescription(feature))}</textarea>

        <label class="field-label">Fotos</label>
        <div class="upload-row">
          <label class="file-label upload-label" for="photoUploadInput">Subir fotos desde el dispositivo</label>
          <input id="photoUploadInput" type="file" accept="image/*" multiple>
        </div>
        <div class="photo-grid" id="photoGrid"></div>

        <label class="field-label">O agrega URLs de fotos, una por línea</label>
        <textarea class="field" id="photosInput" placeholder="https://ejemplo.com/foto.jpg"></textarea>

        <button class="save-btn" id="saveBtn">Aplicar cambios</button>
      `;

      renderPhotoGrid();

      document.getElementById("photoUploadInput").addEventListener("change", function (e) {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;

        let pending = files.length;
        files.forEach(file => {
          const reader = new FileReader();
          reader.onload = function () {
            currentPhotos.push({
              title: file.name,
              web_url: reader.result,
              url: reader.result
            });
            pending -= 1;
            if (pending === 0) {
              renderPhotoGrid();
            }
          };
          reader.onerror = function () {
            showError("No se pudo leer la imagen: " + file.name);
            pending -= 1;
          };
          reader.readAsDataURL(file);
        });

        e.target.value = "";
      });

      document.getElementById("saveBtn").addEventListener("click", function () {
        const title = document.getElementById("titleInput").value;
        const description = document.getElementById("descriptionInput").value;
        const photosText = document.getElementById("photosInput").value;

        p.title = title;
        p.name = title;
        p.description = description;
        p.notes = description;
        if (p.desc !== undefined) p.desc = description;

        const urlPhotos = photosText
          .split("\n")
          .map(url => url.trim())
          .filter(url => url.length > 0)
          .map(url => ({ title: title, web_url: url, url: url }));

        const uploadedPhotos = currentPhotos.map(photo => ({
          ...photo,
          title: photo.title || title
        }));

        p.photos = [...uploadedPhotos, ...urlPhotos];

        updateStats();
        renderList();
        showSuccess("Cambios aplicados. Ahora puedes descargar el GeoJSON actualizado.");
        renderEditor();
      });
    }

    function renderPhotoGrid() {
      const grid = document.getElementById("photoGrid");
      if (!grid) return;
      grid.innerHTML = "";

      currentPhotos.forEach((photo, i) => {
        const src = photo.web_url || photo.url || photo.scaled_url || "";
        const thumb = document.createElement("div");
        thumb.className = "photo-thumb";

        const img = document.createElement("img");
        img.src = src;
        img.alt = photo.title || "foto";

        const removeBtn = document.createElement("div");
        removeBtn.className = "remove-btn";
        removeBtn.textContent = "×";
        removeBtn.addEventListener("click", function () {
          currentPhotos.splice(i, 1);
          renderPhotoGrid();
        });

        thumb.appendChild(img);
        thumb.appendChild(removeBtn);
        grid.appendChild(thumb);
      });
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<​", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    autoLoadBtn.addEventListener("click", async function () {
      try {
        statusBox.textContent = "Intentando cargar rutas-reserva.geojson...";
        const response = await fetch("./rutas-reserva.geojson?nocache=" + Date.now());

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();
        loadGeoJSON(data);
      } catch (error) {
        showError("No se pudo cargar automáticamente. Prueba con carga manual. Error: " + error.message);
      }
    });

    fileInput.addEventListener("change", function () {
      const file = fileInput.files[0];

      if (!file) {
        showError("No seleccionaste ningún archivo.");
        return;
      }

      const reader = new FileReader();

      reader.onload = function () {
        try {
          const data = JSON.parse(reader.result);
          loadGeoJSON(data);
        } catch (error) {
          showError("No se pudo leer el archivo. Error: " + error.message);
        }
      };

      reader.onerror = function () {
        showError("Error leyendo el archivo.");
      };

      reader.readAsText(file);
    });

    searchInput.addEventListener("input", function () {
      searchTerm = searchInput.value.trim().toLowerCase();
      renderList();
    });

    downloadBtn.addEventListener("click", function () {
      if (!geojson) {
        showError("Primero carga un GeoJSON.");
        return;
      }

      const text = JSON.stringify(geojson, null, 2);
      const blob = new Blob([text], { type: "application/geo+json" });
      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = url;
      link.download = "rutas-reserva.geojson";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      URL.revokeObjectURL(url);

      showSuccess("Archivo descargado como rutas-reserva.geojson.");
    });
  </script>
</body>
</html>
