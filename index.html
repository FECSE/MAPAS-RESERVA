<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Reserva</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --forest-950: #07140f;
      --forest-900: #10231a;
      --forest-800: #173527;
      --forest-700: #1f4a36;
      --forest-600: #2f6f4f;
      --forest-100: #e8f2ec;
      --stone-950: #10100e;
      --stone-900: #1d1c18;
      --stone-800: #2b2924;
      --stone-700: #444039;
      --stone-600: #625c51;
      --stone-500: #7c7568;
      --stone-300: #c8c0b2;
      --stone-200: #ddd6ca;
      --stone-100: #eee9df;
      --stone-50: #f8f5ef;
      --accent: #d59f35;
      --accent-dark: #9a6815;
      --white: #ffffff;
      --danger: #b42318;
      --line: rgba(16, 16, 14, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: "Space Grotesk", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--stone-50);
      color: var(--stone-900);
    }

    body {
      overflow: hidden;
    }

    .app-shell {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
      width: 100vw;
    }

    .topbar {
      background: var(--forest-950);
      color: var(--stone-50);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 240px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: grid;
      place-items: center;
      color: var(--accent);
      flex: 0 0 auto;
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.1;
      letter-spacing: -0.02em;
      font-weight: 700;
    }

    .brand p {
      margin: 3px 0 0;
      font-size: 12px;
      color: var(--stone-300);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(90px, 1fr));
      gap: 0;
      border: 1px solid rgba(255, 255, 255, 0.16);
      min-width: 360px;
    }

    .stat {
      padding: 8px 16px;
      border-right: 1px solid rgba(255, 255, 255, 0.16);
    }

    .stat:last-child {
      border-right: 0;
    }

    .stat-value {
      display: block;
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
      color: var(--stone-50);
      font-variant-numeric: tabular-nums;
    }

    .stat-label {
      display: block;
      margin-top: 5px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--stone-300);
    }

    .main {
      display: grid;
      grid-template-columns: 360px 1fr;
      min-height: 0;
    }

    .sidebar {
      background: var(--stone-50);
      border-right: 1px solid var(--line);
      display: grid;
      grid-template-rows: auto auto 1fr;
      min-height: 0;
      z-index: 800;
    }

    .sidebar-header {
      padding: 22px 22px 16px;
      border-bottom: 1px solid var(--line);
    }

    .sidebar-header h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .sidebar-header p {
      margin: 8px 0 0;
      color: var(--stone-600);
      font-size: 13px;
      line-height: 1.5;
    }

    .search-row {
      margin-top: 16px;
      position: relative;
    }

    .search-row i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--stone-500);
      font-size: 13px;
    }

    .search-row input {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--stone-900);
      padding: 11px 12px 11px 36px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      border-radius: 0;
    }

    .search-row input:focus {
      border-color: var(--forest-700);
      box-shadow: 0 0 0 2px rgba(47, 111, 79, 0.16);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--line);
    }

    .tab {
      border: 0;
      background: var(--stone-50);
      border-right: 1px solid var(--line);
      padding: 13px 10px;
      font-family: inherit;
      font-weight: 700;
      color: var(--stone-700);
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease;
    }

    .tab:last-child {
      border-right: 0;
    }

    .tab.active {
      background: var(--forest-900);
      color: var(--stone-50);
    }

    .tab:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .feature-list {
      overflow: auto;
      min-height: 0;
    }

    .feature-row {
      display: block;
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: left;
      padding: 16px 22px;
      font-family: inherit;
      color: inherit;
      cursor: pointer;
      transition: background 160ms ease;
    }

    .feature-row:hover,
    .feature-row:focus-visible {
      background: var(--stone-100);
      outline: none;
    }

    .feature-row-title {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.25;
      color: var(--stone-900);
    }

    .feature-color {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 1px solid rgba(0, 0, 0, 0.22);
      flex: 0 0 auto;
      margin-top: 3px;
    }

    .feature-meta {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      color: var(--stone-600);
      font-size: 12px;
      line-height: 1.4;
    }

    .feature-meta span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .empty-state {
      padding: 22px;
      color: var(--stone-600);
      font-size: 14px;
      line-height: 1.5;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 0;
      background: var(--stone-200);
    }

    .leaflet-control-layers {
      border-radius: 0 !important;
      box-shadow: none !important;
      border: 1px solid var(--line) !important;
      font-family: "Space Grotesk", system-ui, sans-serif;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 0;
      box-shadow: none;
      border: 1px solid rgba(16, 16, 14, 0.18);
    }

    .leaflet-popup-content {
      margin: 0;
      width: 280px !important;
      font-family: "Space Grotesk", system-ui, sans-serif;
    }

    .leaflet-popup-tip {
      box-shadow: none;
    }

    .popup {
      background: var(--white);
      color: var(--stone-900);
    }

    .popup-header {
      padding: 14px 15px 12px;
      border-bottom: 1px solid var(--line);
    }

    .popup-kicker {
      margin: 0 0 6px;
      color: var(--accent-dark);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
    }

    .popup-title {
      margin: 0;
      color: var(--stone-900);
      font-size: 17px;
      line-height: 1.2;
      font-weight: 700;
    }

    .popup-body {
      padding: 12px 15px 15px;
      color: var(--stone-700);
      font-size: 13px;
      line-height: 1.45;
    }

    .popup-body p {
      margin: 0 0 10px;
    }

    .popup-body p:last-child {
      margin-bottom: 0;
    }

    .popup-photos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .popup-photos img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border: 1px solid var(--line);
    }

    .popup-photo-note {
      margin-top: 10px;
      color: var(--stone-600);
      font-size: 12px;
    }

    .trail-label {
      background: var(--forest-950);
      color: var(--stone-50);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 0;
      box-shadow: none;
      padding: 4px 8px;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 12px;
      font-weight: 700;
    }

    .poi-marker {
      width: 18px;
      height: 18px;
      background: var(--accent);
      border: 2px solid var(--forest-950);
    }

    .map-message {
      position: absolute;
      left: 50%;
      top: 22px;
      transform: translateX(-50%);
      z-index: 1200;
      max-width: min(520px, calc(100vw - 40px));
      background: var(--forest-950);
      color: var(--stone-50);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.4;
      display: none;
    }

    .map-message.is-visible {
      display: block;
    }

    @media (max-width: 920px) {
      body {
        overflow: auto;
      }

      .app-shell {
        height: auto;
        min-height: 100vh;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        width: 100%;
        min-width: 0;
      }

      .main {
        grid-template-columns: 1fr;
        grid-template-rows: auto 70vh;
      }

      .sidebar {
        max-height: 48vh;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
    }

    @media (max-width: 560px) {
      .topbar {
        padding: 16px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .stat {
        border-right: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.16);
      }

      .stat:last-child {
        border-bottom: 0;
      }

      .sidebar-header,
      .feature-row {
        padding-left: 16px;
        padding-right: 16px;
      }
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <i class="fa-solid fa-route"></i>
        </div>
        <div>
          <h1>Rutas Reserva</h1>
          <p>Senderos y puntos de interés desde GeoJSON</p>
        </div>
      </div>

      <section class="stats" aria-label="Resumen del mapa">
        <div class="stat">
          <span class="stat-value" id="count-trails">0</span>
          <span class="stat-label">Senderos</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="count-points">0</span>
          <span class="stat-label">Puntos</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="count-photos">0</span>
          <span class="stat-label">Fotos</span>
        </div>
      </section>
    </header>

    <main class="main">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Explorar la reserva</h2>
          <p>Datos cargados exclusivamente desde <strong>rutas-reserva.geojson</strong>. Los puntos de cámaras fueron excluidos.</p>

          <div class="search-row">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <input id="search-input" type="search" placeholder="Buscar sendero o punto..." autocomplete="off" />
          </div>
        </div>

        <div class="tabs" role="tablist" aria-label="Tipo de elemento">
          <button class="tab active" id="tab-trails" type="button" role="tab" aria-selected="true">Senderos</button>
          <button class="tab" id="tab-points" type="button" role="tab" aria-selected="false">Puntos de interés</button>
        </div>

        <div class="feature-list" id="feature-list" aria-live="polite"></div>
      </aside>

      <section id="map-wrap" style="position: relative;">
        <div id="map"></div>
        <div class="map-message" id="map-message"></div>
      </section>
    </main>
  </div>

  <script>
    const GEOJSON_URL = "rutas-reserva.geojson";

    /*
      Agrega aquí tus fotos futuras desde GitHub.

      La clave debe coincidir exactamente con el título del punto o sendero.
      Puedes usar URLs absolutas de GitHub raw, por ejemplo:

      const PHOTO_LIBRARY = {
        "Mirador de aves": [
          "https://raw.githubusercontent.com/usuario/repositorio/main/fotos/mirador-aves-1.jpg",
          "https://raw.githubusercontent.com/usuario/repositorio/main/fotos/mirador-aves-2.jpg"
        ],
        "Cascada": [
          "https://raw.githubusercontent.com/usuario/repositorio/main/fotos/cascada-1.jpg"
        ]
      };

      Si una clave no existe aquí, el mapa usará las fotos que vengan en el GeoJSON
      cuando tengan URL disponible.
    */
    const PHOTO_LIBRARY = {};

    let map;
    let trailsLayer;
    let pointsLayer;
    let allTrails = [];
    let allPoints = [];
    let currentTab = "trails";

    const CAMERA_WORDS = ["cámara", "camara", "camera"];

    document.addEventListener("DOMContentLoaded", init);

    function init() {
      initMap();
      bindUI();
      loadGeoJson();
    }

    function initMap() {
      map = L.map("map", {
        zoomControl: true,
        preferCanvas: true
      }).setView([0.1523, -78.8452], 16);

      const satellite = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
        attribution: "Tiles &copy; Esri"
      });

      const topo = L.tileLayer("https://cdnjs.cloudflare.com/ajax/libs/leaflet-providers/1.13.0/leaflet-providers.min.js", {
        attribution: ""
      });

      const openStreetMap = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 20,
        attribution: "&copy; OpenStreetMap contributors"
      });

      const cartoTopo = L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
        maxZoom: 20,
        attribution: "&copy; OpenStreetMap contributors &copy; CARTO"
      });

      satellite.addTo(map);

      trailsLayer = L.layerGroup().addTo(map);
      pointsLayer = L.layerGroup().addTo(map);

      L.control.layers(
        {
          "Satélite": satellite,
          "OpenStreetMap": openStreetMap,
          "Carto claro": cartoTopo
        },
        {
          "Senderos": trailsLayer,
          "Puntos de interés": pointsLayer
        },
        {
          collapsed: true
        }
      ).addTo(map);
    }

    function bindUI() {
      document.getElementById("tab-trails").addEventListener("click", function () {
        setTab("trails");
      });

      document.getElementById("tab-points").addEventListener("click", function () {
        setTab("points");
      });

      document.getElementById("search-input").addEventListener("input", renderSidebarList);
    }

    async function loadGeoJson() {
      try {
        showMessage("Cargando rutas desde rutas-reserva.geojson...");
        const response = await fetch(GEOJSON_URL);

        if (!response.ok) {
          throw new Error("No se pudo cargar el archivo GeoJSON.");
        }

        const geoJson = await response.json();
        renderData(geoJson);
        hideMessage();
      } catch (error) {
        console.error(error);
        showMessage("No se pudo cargar rutas-reserva.geojson. Confirma que el archivo esté en la misma carpeta que este HTML.");
      }
    }

    function renderData(geoJson) {
      trailsLayer.clearLayers();
      pointsLayer.clearLayers();

      const features = Array.isArray(geoJson.features) ? geoJson.features : [];

      const activeFeatures = features.filter(function (feature) {
        const props = feature.properties || {};
        return props.deleted !== true && feature.geometry;
      });

      allTrails = activeFeatures
        .filter(function (feature) {
          return isTrailGeometry(feature.geometry);
        })
        .map(normalizeTrail)
        .filter(Boolean);

      allPoints = buildPointsFromGeoJson(activeFeatures)
        .filter(function (point) {
          return !isCameraText(point.title);
        });

      let totalPhotos = 0;

      allTrails.forEach(function (trail) {
        drawTrail(trail);
        totalPhotos += trail.photos.length;
      });

      allPoints.forEach(function (point) {
        drawPoint(point);
        totalPhotos += point.photos.length;
      });

      document.getElementById("count-trails").textContent = allTrails.length;
      document.getElementById("count-points").textContent = allPoints.length;
      document.getElementById("count-photos").textContent = totalPhotos;

      fitMapToData();
      renderSidebarList();
    }

    function isTrailGeometry(geometry) {
      return geometry.type === "LineString" || geometry.type === "MultiLineString";
    }

    function normalizeTrail(feature) {
      const props = feature.properties || {};
      const geometry = feature.geometry || {};
      const title = getTitle(props);

      if (isCameraText(title)) {
        return null;
      }

      const lines = geometryToLatLngLines(geometry);

      if (!lines.length) {
        return null;
      }

      return {
        id: feature.id || props.id || title,
        title: title,
        notes: props.notes || "",
        color: props.hexcolor || getStrokeColor(feature) || "#2f6f4f",
        distance: Number(props.distance) || 0,
        totalAscent: Number(props.total_ascent) || 0,
        totalDescent: Number(props.total_descent) || 0,
        movingTime: Number(props.moving_time) || 0,
        totalTime: Number(props.total_time) || 0,
        photos: getPhotosForTitle(title, props.photos || []),
        lines: lines,
        originalFeature: feature,
        layer: null
      };
    }

    function buildPointsFromGeoJson(features) {
      const points = [];

      features.forEach(function (feature) {
        const props = feature.properties || {};
        const geometry = feature.geometry || {};

        if (geometry.type === "Point") {
          const title = getTitle(props);

          if (!isCameraText(title)) {
            const coords = geometry.coordinates || [];
            points.push({
              id: feature.id || props.id || title,
              title: title,
              notes: props.notes || "",
              lat: Number(coords[1]),
              lng: Number(coords[0]),
              elevation: props.elevation,
              photos: getPhotosForTitle(title, props.photos || []),
              source: "point",
              layer: null
            });
          }
        }

        const photoPoints = Array.isArray(props.photos) ? props.photos : [];

        photoPoints.forEach(function (photo) {
          if (photo.deleted === true) {
            return;
          }

          const photoTitle = photo.title || getTitle(props);

          if (isCameraText(photoTitle)) {
            return;
          }

          const lat = Number(photo.latitude);
          const lng = Number(photo.longitude);

          if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
            return;
          }

          const photosForPoint = getPhotosForTitle(photoTitle, [photo]);

          points.push({
            id: photo.id || photoTitle + "-" + lat + "-" + lng,
            title: photoTitle,
            notes: photo.notes || "",
            lat: lat,
            lng: lng,
            elevation: photo.elevation,
            photos: photosForPoint,
            source: "photo",
            parentTrail: getTitle(props),
            layer: null
          });
        });
      });

      return mergeNearbyPoints(points);
    }

    function mergeNearbyPoints(points) {
      const grouped = [];

      points.forEach(function (point) {
        const existing = grouped.find(function (item) {
          return item.title === point.title &&
            Math.abs(item.lat - point.lat) < 0.00004 &&
            Math.abs(item.lng - point.lng) < 0.00004;
        });

        if (existing) {
          point.photos.forEach(function (photo) {
            if (!existing.photos.some(function (existingPhoto) {
              return existingPhoto.url === photo.url;
            })) {
              existing.photos.push(photo);
            }
          });
        } else {
          grouped.push(point);
        }
      });

      return grouped;
    }

    function geometryToLatLngLines(geometry) {
      if (!geometry || !geometry.coordinates) {
        return [];
      }

      if (geometry.type === "LineString") {
        const line = coordinatesToLatLngs(geometry.coordinates);
        return line.length ? [line] : [];
      }

      if (geometry.type === "MultiLineString") {
        return geometry.coordinates
          .map(coordinatesToLatLngs)
          .filter(function (line) {
            return line.length > 1;
          });
      }

      return [];
    }

    function coordinatesToLatLngs(coordinates) {
      return coordinates
        .map(function (coord) {
          const lng = Number(coord[0]);
          const lat = Number(coord[1]);

          if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
            return null;
          }

          return [lat, lng];
        })
        .filter(Boolean);
    }

    function drawTrail(trail) {
      const layerGroup = L.layerGroup();

      trail.lines.forEach(function (latlngs) {
        L.polyline(latlngs, {
          color: trail.color,
          weight: 5,
          opacity: 0.92,
          lineCap: "round",
          lineJoin: "round"
        }).addTo(layerGroup);

        L.polyline(latlngs, {
          color: "#ffffff",
          weight: 1.5,
          opacity: 0.75,
          lineCap: "round",
          lineJoin: "round"
        }).addTo(layerGroup);
      });

      layerGroup.bindPopup(buildTrailPopup(trail));

      layerGroup.on("mouseover", function () {
        layerGroup.openPopup();
      });

      layerGroup.on("click", function () {
        focusTrail(trail);
      });

      layerGroup.addTo(trailsLayer);
      trail.layer = layerGroup;
    }

    function drawPoint(point) {
      const marker = L.marker([point.lat, point.lng], {
        icon: L.divIcon({
          className: "",
          html: '<div class="poi-marker"></div>',
          iconSize: [18, 18],
          iconAnchor: [9, 9],
          popupAnchor: [0, -9]
        }),
        title: point.title
      });

      marker.bindPopup(buildPointPopup(point), {
        closeButton: false,
        autoPan: true
      });

      marker.on("mouseover", function () {
        marker.openPopup();
      });

      marker.on("mouseout", function () {
        window.setTimeout(function () {
          marker.closePopup();
        }, 250);
      });

      marker.on("click", function () {
        map.setView([point.lat, point.lng], Math.max(map.getZoom(), 18));
        marker.openPopup();
      });

      marker.addTo(pointsLayer);
      point.layer = marker;
    }

    function buildTrailPopup(trail) {
      const photoHtml = buildPhotoHtml(trail.photos);
      const distance = trail.distance ? formatDistance(trail.distance) : "Sin distancia registrada";
      const ascent = trail.totalAscent ? Math.round(trail.totalAscent) + " m de ascenso" : "Ascenso no registrado";
      const time = trail.movingTime ? formatDuration(trail.movingTime) + " en movimiento" : "Tiempo no registrado";

      return [
        '<article class="popup">',
          '<div class="popup-header">',
            '<p class="popup-kicker">Sendero</p>',
            '<h3 class="popup-title">' + escapeHtml(trail.title) + '</h3>',
          '</div>',
          '<div class="popup-body">',
            '<p>' + escapeHtml(distance) + " · " + escapeHtml(ascent) + '</p>',
            '<p>' + escapeHtml(time) + '</p>',
            trail.notes ? '<p>' + escapeHtml(trail.notes) + '</p>' : '',
            photoHtml,
          '</div>',
        '</article>'
      ].join("");
    }

    function buildPointPopup(point) {
      const photoHtml = buildPhotoHtml(point.photos);
      const elevation = point.elevation !== null && point.elevation !== undefined && point.elevation !== ""
        ? Math.round(Number(point.elevation)) + " m s. n. m."
        : "Elevación no registrada";

      return [
        '<article class="popup">',
          '<div class="popup-header">',
            '<p class="popup-kicker">Punto de interés</p>',
            '<h3 class="popup-title">' + escapeHtml(point.title) + '</h3>',
          '</div>',
          '<div class="popup-body">',
            '<p>' + escapeHtml(elevation) + '</p>',
            point.parentTrail ? '<p>Relacionado con: ' + escapeHtml(point.parentTrail) + '</p>' : '',
            point.notes ? '<p>' + escapeHtml(point.notes) + '</p>' : '',
            photoHtml,
          '</div>',
        '</article>'
      ].join("");
    }

    function buildPhotoHtml(photos) {
      if (!photos.length) {
        return '<p class="popup-photo-note">Fotos pendientes. Puedes agregarlas luego en PHOTO_LIBRARY usando este mismo título.</p>';
      }

      const images = photos.slice(0, 4).map(function (photo) {
        return '<img src="' + escapeAttribute(photo.url) + '" alt="' + escapeAttribute(photo.alt || "Foto del punto de interés") + '" loading="lazy">';
      }).join("");

      return '<div class="popup-photos">' + images + '</div>';
    }

    function getPhotosForTitle(title, geoJsonPhotos) {
      const manualPhotos = Array.isArray(PHOTO_LIBRARY[title]) ? PHOTO_LIBRARY[title] : [];

      if (manualPhotos.length) {
        return manualPhotos.map(function (url, index) {
          return {
            url: url,
            alt: title + " foto " + (index + 1)
          };
        });
      }

      return geoJsonPhotos
        .filter(function (photo) {
          return photo && photo.deleted !== true && !isCameraText(photo.title || "");
        })
        .map(function (photo) {
          const url = photo.web_url || photo.scaled_url || photo.thumbnail_url || photo.fullsize_url;

          if (!url) {
            return null;
          }

          return {
            url: url,
            alt: photo.title || title
          };
        })
        .filter(Boolean);
    }

    function setTab(tabName) {
      currentTab = tabName;

      const trailsTab = document.getElementById("tab-trails");
      const pointsTab = document.getElementById("tab-points");

      trailsTab.classList.toggle("active", tabName === "trails");
      pointsTab.classList.toggle("active", tabName === "points");

      trailsTab.setAttribute("aria-selected", tabName === "trails" ? "true" : "false");
      pointsTab.setAttribute("aria-selected", tabName === "points" ? "true" : "false");

      renderSidebarList();
    }

    function renderSidebarList() {
      const list = document.getElementById("feature-list");
      const searchValue = document.getElementById("search-input").value.trim().toLowerCase();

      const source = currentTab === "trails" ? allTrails : allPoints;

      const filtered = source.filter(function (item) {
        const title = item.title.toLowerCase();
        const notes = (item.notes || "").toLowerCase();
        const parentTrail = (item.parentTrail || "").toLowerCase();

        return !searchValue ||
          title.includes(searchValue) ||
          notes.includes(searchValue) ||
          parentTrail.includes(searchValue);
      });

      if (!filtered.length) {
        list.innerHTML = '<div class="empty-state">No hay elementos que coincidan con la búsqueda actual.</div>';
        return;
      }

      list.innerHTML = "";

      filtered.forEach(function (item) {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "feature-row";

        if (currentTab === "trails") {
          row.innerHTML = buildTrailRow(item);
          row.addEventListener("click", function () {
            focusTrail(item);
          });
        } else {
          row.innerHTML = buildPointRow(item);
          row.addEventListener("click", function () {
            focusPoint(item);
          });
        }

        list.appendChild(row);
      });
    }

    function buildTrailRow(trail) {
      return [
        '<div class="feature-row-title">',
          '<span>' + escapeHtml(trail.title) + '</span>',
          '<span class="feature-color" style="background:' + escapeAttribute(trail.color) + '"></span>',
        '</div>',
        '<div class="feature-meta">',
          '<span><i class="fa-solid fa-ruler-horizontal"></i>' + escapeHtml(formatDistance(trail.distance)) + '</span>',
          '<span><i class="fa-solid fa-mountain"></i>' + Math.round(trail.totalAscent || 0) + ' m ascenso</span>',
          '<span><i class="fa-regular fa-image"></i>' + trail.photos.length + ' fotos</span>',
        '</div>'
      ].join("");
    }

    function buildPointRow(point) {
      const elevation = point.elevation !== null && point.elevation !== undefined && point.elevation !== ""
        ? Math.round(Number(point.elevation)) + " m"
        : "Sin elevación";

      return [
        '<div class="feature-row-title">',
          '<span>' + escapeHtml(point.title) + '</span>',
          '<span class="feature-color" style="background: var(--accent)"></span>',
        '</div>',
        '<div class="feature-meta">',
          '<span><i class="fa-solid fa-location-dot"></i>' + escapeHtml(elevation) + '</span>',
          '<span><i class="fa-regular fa-image"></i>' + point.photos.length + ' fotos</span>',
          point.parentTrail ? '<span><i class="fa-solid fa-route"></i>' + escapeHtml(point.parentTrail) + '</span>' : '',
        '</div>'
      ].join("");
    }

    function focusTrail(trail) {
      if (!trail.layer) {
        return;
      }

      const bounds = L.latLngBounds([]);

      trail.lines.forEach(function (line) {
        line.forEach(function (latlng) {
          bounds.extend(latlng);
        });
      });

      if (bounds.isValid()) {
        map.fitBounds(bounds, {
          padding: [36, 36],
          maxZoom: 18
        });
      }

      trail.layer.openPopup();
    }

    function focusPoint(point) {
      if (!point.layer) {
        return;
      }

      map.setView([point.lat, point.lng], Math.max(map.getZoom(), 18));
      point.layer.openPopup();
    }

    function fitMapToData() {
      const bounds = L.latLngBounds([]);

      allTrails.forEach(function (trail) {
        trail.lines.forEach(function (line) {
          line.forEach(function (latlng) {
            bounds.extend(latlng);
          });
        });
      });

      allPoints.forEach(function (point) {
        bounds.extend([point.lat, point.lng]);
      });

      if (bounds.isValid()) {
        map.fitBounds(bounds, {
          padding: [30, 30]
        });
      }
    }

    function getTitle(props) {
      return props.title || props.name || props.id || "Sin nombre";
    }

    function getStrokeColor(feature) {
      if (feature.style && feature.style.stroke) {
        return feature.style.stroke;
      }

      if (feature.properties && feature.properties.marker_color) {
        return feature.properties.marker_color;
      }

      return null;
    }

    function isCameraText(value) {
      const text = String(value || "").toLowerCase();
      return CAMERA_WORDS.some(function (word) {
        return text.includes(word);
      });
    }

    function formatDistance(meters) {
      const value = Number(meters) || 0;

      if (value >= 1000) {
        return (value / 1000).toFixed(2) + " km";
      }

      return Math.round(value) + " m";
    }

    function formatDuration(seconds) {
      const totalSeconds = Math.max(0, Number(seconds) || 0);
      const minutes = Math.round(totalSeconds / 60);

      if (minutes < 60) {
        return minutes + " min";
      }

      const hours = Math.floor(minutes / 60);
      const remainingMinutes = minutes % 60;

      return hours + " h " + remainingMinutes + " min";
    }

    function showMessage(message) {
      const element = document.getElementById("map-message");
      element.textContent = message;
      element.classList.add("is-visible");
    }

    function hideMessage() {
      const element = document.getElementById("map-message");
      element.classList.remove("is-visible");
      element.textContent = "";
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<​", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replaceAll("`", "&#096;");
    }
  </script>
</body>
</html>
