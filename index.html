<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Mapa Reserva Natural</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-950: #070b10;
      --bg-925: #0b1118;
      --bg-900: #101720;
      --bg-850: #141c26;
      --bg-800: #182230;
      --line: rgba(148, 163, 184, 0.16);
      --line-strong: rgba(148, 163, 184, 0.28);
      --text: #e5edf7;
      --muted: #8ea0b5;
      --muted-2: #65758a;
      --green: #18c964;
      --green-dark: #0f9f4d;
      --blue: #3b82f6;
      --cyan: #06b6d4;
      --orange: #f97316;
      --purple: #8b5cf6;
      --pink: #d946ef;
      --red: #ef4444;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: "Space Grotesk", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-950);
      color: var(--text);
    }

    body {
      overflow: hidden;
    }

    .app-shell {
      display: grid;
      grid-template-rows: 64px 1fr;
      height: 100vh;
      width: 100vw;
      background: var(--bg-950);
    }

    .topbar {
      background: var(--bg-900);
      color: var(--text);
      border-bottom: 1px solid var(--line);
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 240px;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      color: var(--green);
      border: 1px solid var(--line-strong);
      background: var(--bg-850);
    }

    .brand h1 {
      margin: 0;
      color: var(--text);
      font-size: 14px;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .brand p {
      margin: 0 0 5px;
      color: var(--green);
      font-size: 9px;
      line-height: 1;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, auto);
      gap: 24px;
      min-width: 0;
      border: 0;
    }

    .stat {
      padding: 0;
      border: 0;
      text-align: center;
    }

    .stat-value {
      display: block;
      color: #60a5fa;
      font-size: 13px;
      line-height: 1;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .stat-label {
      display: block;
      margin-top: 5px;
      color: var(--muted-2);
      font-size: 8px;
      line-height: 1;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.11em;
    }

    .main {

    .editor-map-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      background: var(--green);
      color: #04110a;
      border: 1px solid var(--green);
      border-radius: 3px;
      text-decoration: none;
      font-size: 11px;
      line-height: 1;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      white-space: nowrap;
      transition: background 140ms ease, color 140ms ease, border-color 140ms ease;
    }

    .editor-map-button:hover {
      background: var(--green-dark);
      border-color: var(--green-dark);
      color: #ffffff;
    }

    .editor-map-button:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 2px;
    }

      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 0;
    }

    .sidebar {
      background: var(--bg-925);
      border-right: 1px solid var(--line);
      display: grid;
      grid-template-rows: auto auto 1fr;
      min-height: 0;
      z-index: 800;
    }

    .sidebar-header {
      padding: 0;
      border-bottom: 1px solid var(--line);
    }

    .sidebar-title {
      padding: 14px 14px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--bg-900);
    }

    .sidebar-title h2 {
      margin: 0;
      color: var(--text);
      font-size: 13px;
      line-height: 1.2;
      font-weight: 800;
    }

    .sidebar-title p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.35;
    }

    .search-row {
      margin: 0;
      padding: 12px;
      position: relative;
      background: var(--bg-925);
      border-bottom: 1px solid var(--line);
    }

    .search-row i {
      position: absolute;
      left: 23px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted-2);
      font-size: 11px;
      pointer-events: none;
    }

    .search-row input {
      width: 100%;
      border: 1px solid var(--line-strong);
      background: var(--bg-850);
      color: var(--text);
      padding: 11px 12px 11px 32px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
      border-radius: 3px;
    }

    .search-row input::placeholder {
      color: var(--muted-2);
    }

    .search-row input:focus {
      border-color: var(--green);
      box-shadow: none;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg-925);
      border-bottom: 1px solid var(--line);
    }

    .tab {
      border: 0;
      border-right: 1px solid var(--line);
      background: var(--bg-925);
      color: var(--muted);
      padding: 14px 8px;
      font-family: inherit;
      font-size: 11px;
      line-height: 1;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 140ms ease, color 140ms ease, border-color 140ms ease;
    }

    .tab:last-child {
      border-right: 0;
    }

    .tab.active {
      background: var(--bg-925);
      color: var(--text);
      border-bottom: 3px solid var(--green);
    }

    .tab:hover {
      color: var(--text);
      background: var(--bg-850);
    }

    .tab:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: -2px;
    }

    .feature-list {
      overflow: auto;
      min-height: 0;
      background: var(--bg-925);
    }

    .feature-list::-webkit-scrollbar {
      width: 8px;
    }

    .feature-list::-webkit-scrollbar-track {
      background: var(--bg-925);
    }

    .feature-list::-webkit-scrollbar-thumb {
      background: var(--bg-800);
      border: 1px solid var(--line);
    }

    .feature-row {
      display: block;
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: left;
      padding: 13px 14px;
      font-family: inherit;
      color: inherit;
      cursor: pointer;
      transition: background 140ms ease;
    }

    .feature-row:hover,
    .feature-row:focus-visible {
      background: var(--bg-850);
      outline: none;
    }

    .feature-row-title {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.25;
    }

    .feature-color {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      flex: 0 0 auto;
      margin-top: 0;
      border-radius: 3px;
    }

    .feature-color::before {
      content: "\f542";
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      color: #ffffff;
      font-size: 10px;
    }

    .feature-color.point::before {
      content: "\f3c5";
    }

    .feature-meta {
      margin-top: 5px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px 10px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.4;
    }

    .feature-meta span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .feature-meta i {
      font-size: 9px;
      color: var(--muted-2);
    }

    .empty-state {
      padding: 18px 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 0;
      background: #101720;
    }

    .leaflet-control-zoom {
      border: 0 !important;
      margin-top: 14px !important;
      margin-left: 14px !important;
    }

    .leaflet-control-zoom a {
      width: 28px !important;
      height: 28px !important;
      line-height: 27px !important;
      background: #ffffff !important;
      color: #111827 !important;
      border: 1px solid rgba(15, 23, 42, 0.2) !important;
      border-radius: 2px !important;
      font-weight: 800;
    }

    .leaflet-control-layers {
      border-radius: 3px !important;
      box-shadow: none !important;
      border: 1px solid var(--line-strong) !important;
      background: var(--bg-900) !important;
      color: var(--text) !important;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 11px;
    }

    .leaflet-control-layers-expanded {
      padding: 8px 10px !important;
    }

    .leaflet-control-layers label {
      color: var(--text);
      font-weight: 600;
    }

    .leaflet-control-layers-toggle {
      background-color: #ffffff !important;
    }

    .leaflet-control-attribution {
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 10px;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 3px;
      box-shadow: none;
      border: 1px solid rgba(15, 23, 42, 0.22);
      overflow: hidden;
    }

    .leaflet-popup-content {
      margin: 0;
      width: 280px !important;
      font-family: "Space Grotesk", system-ui, sans-serif;
    }

    .leaflet-popup-tip {
      box-shadow: none;
    }

    .popup {
      background: #ffffff;
      color: #111827;
    }

    .popup-header {
      padding: 13px 14px 11px;
      border-bottom: 1px solid rgba(15, 23, 42, 0.12);
      background: #f8fafc;
    }

    .popup-kicker {
      margin: 0 0 5px;
      color: #047857;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 800;
    }

    .popup-title {
      margin: 0;
      color: #111827;
      font-size: 15px;
      line-height: 1.2;
      font-weight: 800;
    }

    .popup-body {
      padding: 12px 14px 14px;
      color: #374151;
      font-size: 12px;
      line-height: 1.45;
    }

    .popup-body p {
      margin: 0 0 9px;
    }

    .popup-body p:last-child {
      margin-bottom: 0;
    }

    .popup-photos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .popup-photos img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border: 1px solid rgba(15, 23, 42, 0.14);
      border-radius: 2px;
    }

    .popup-photo-note {
      margin-top: 10px;
      color: #64748b;
      font-size: 11px;
    }

    .poi-marker {
      width: 17px;
      height: 17px;
      background: var(--cyan);
      border: 2px solid #ffffff;
      border-radius: 999px;
    }

    .map-message {
      position: absolute;
      left: 50%;
      top: 18px;
      transform: translateX(-50%);
      z-index: 1200;
      max-width: min(520px, calc(100vw - 40px));
      background: var(--bg-900);
      color: var(--text);
      border: 1px solid var(--line-strong);
      padding: 11px 13px;
      font-size: 12px;
      line-height: 1.4;
      display: none;
      border-radius: 3px;
    }

    .map-message.is-visible {
      display: block;
    }

    @media (max-width: 920px) {
      body {
        overflow: auto;
      }

      .app-shell {
        height: auto;
        min-height: 100vh;
        grid-template-rows: auto 1fr;
      }

      .topbar {
        min-height: 64px;
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        padding: 12px 14px;
        gap: 10px;
      }

      .stats {
        width: 100%;
        grid-template-columns: repeat(3, 1fr);
        gap: 0;
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }

      .main {
        grid-template-columns: 1fr;
        grid-template-rows: auto 70vh;
      }

      .sidebar {
        max-height: 48vh;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
    }

    @media (max-width: 560px) {
      .stats {
        grid-template-columns: repeat(3, 1fr);
      }

      .stat-label {
        font-size: 7px;
      }

      .main {
        grid-template-rows: auto 68vh;
      }
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <i class="fa-solid fa-route"></i>
        </div>
        <div>
          <p>Reserva Natural</p>
          <h1>Mapa de Rutas y Transectos</h1>
        </div>
      </div>

      <section class="stats" aria-label="Resumen del mapa">
        <div class="stat">
          <span class="stat-value" id="count-trails">0</span>
          <span class="stat-label">Senderos</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="count-points">0</span>
          <span class="stat-label">Puntos</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="count-photos">0</span>
          <span class="stat-label">Fotos</span>
        </div>
      </section>

      <a href="./editor.html" target="_blank" class="editor-map-button">
        <i class="fa-solid fa-pen-to-square"></i>
        Editor
      </a>
    </header>

    <main class="main">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-title">
            <h2>Explorar mapa</h2>
            <p>Rutas, transectos y puntos de interés cargados desde GeoJSON.</p>
          </div>

          <div class="search-row">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <input id="search-input" type="search" placeholder="Buscar ruta o punto..." autocomplete="off" />
          </div>
        </div>

        <div class="tabs" role="tablist" aria-label="Tipo de elemento">
          <button class="tab active" id="tab-trails" type="button" role="tab" aria-selected="true">
            Senderos
          </button>
          <button class="tab" id="tab-points" type="button" role="tab" aria-selected="false">
            Puntos
          </button>
        </div>

        <div class="feature-list" id="feature-list" aria-live="polite"></div>
      </aside>

      <section id="map-wrap" style="position: relative;">
        <div id="map"></div>
        <div class="map-message" id="map-message"></div>
      </section>
    </main>
  </div>

  <script>
    const GEOJSON_URL = "./rutas-reserva.geojson";

    /*
      Para agregar fotos luego desde GitHub:

      1. Sube las fotos a GitHub.
      2. Usa el enlace RAW de cada imagen.
      3. Agrega cada URL dentro de PHOTO_LIBRARY.
      4. La clave debe coincidir con el nombre exacto del punto o sendero.

      Ejemplo:

      const PHOTO_LIBRARY = {
        "Mirador de aves": [
          "https://raw.githubusercontent.com/usuario/repositorio/main/fotos/mirador-aves-1.jpg",
          "https://raw.githubusercontent.com/usuario/repositorio/main/fotos/mirador-aves-2.jpg"
        ],
        "Cascada": [
          "https://raw.githubusercontent.com/usuario/repositorio/main/fotos/cascada-1.jpg"
        ]
      };
    */

    const PHOTO_LIBRARY = {};

    let map;
    let trailsLayer;
    let pointsLayer;
    let allTrails = [];
    let allPoints = [];
    let currentTab = "trails";

    const CAMERA_WORDS = ["cámara", "camara", "camera"];

    document.addEventListener("DOMContentLoaded", init);

    function init() {
      initMap();
      bindUI();
      loadGeoJson();
    }

    function initMap() {
      map = L.map("map", {
        zoomControl: true,
        preferCanvas: true
      }).setView([0.1523, -78.8452], 16);

      const satellite = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
        maxZoom: 19,
        attribution: "Tiles &copy; Esri"
      });

      const topographic = L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
        maxZoom: 17,
        attribution: "Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap"
      });

      const standard = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      });

      satellite.addTo(map);

      trailsLayer = L.layerGroup().addTo(map);
      pointsLayer = L.layerGroup().addTo(map);

      L.control.layers(
        {
          "Satélite": satellite,
          "Topográfico": topographic,
          "Estándar": standard
        },
        {
          "Senderos": trailsLayer,
          "Puntos de interés": pointsLayer
        },
        {
          collapsed: true
        }
      ).addTo(map);
    }

    function bindUI() {
      document.getElementById("tab-trails").addEventListener("click", function () {
        setTab("trails");
      });

      document.getElementById("tab-points").addEventListener("click", function () {
        setTab("points");
      });

      document.getElementById("search-input").addEventListener("input", renderSidebarList);
    }

    async function loadGeoJson() {
      try {
        showMessage("Cargando rutas desde rutas-reserva.geojson...");

        const response = await fetch(GEOJSON_URL, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("No se pudo cargar el archivo GeoJSON. Estado: " + response.status);
        }

        const geoJson = await response.json();

        console.log("GeoJSON cargado correctamente:", geoJson);

        renderData(geoJson);
        hideMessage();
      } catch (error) {
        console.error("Error cargando GeoJSON:", error);
        showMessage("No se pudo cargar rutas-reserva.geojson. Revisa que esté en la misma carpeta que Index.html y que el nombre sea exacto.");
      }
    }

    function renderData(geoJson) {
      trailsLayer.clearLayers();
      pointsLayer.clearLayers();

      const features = Array.isArray(geoJson.features) ? geoJson.features : [];

      const activeFeatures = features.filter(function (feature) {
        const props = feature.properties || {};
        return props.deleted !== true && feature.geometry;
      });

      allTrails = activeFeatures
        .filter(function (feature) {
          return isTrailGeometry(feature.geometry);
        })
        .map(normalizeTrail)
        .filter(Boolean);

      allPoints = buildPointsFromGeoJson(activeFeatures)
        .filter(function (point) {
          return !isCameraText(point.title);
        });

      let totalPhotos = 0;

      allTrails.forEach(function (trail) {
        drawTrail(trail);
        totalPhotos += trail.photos.length;
      });

      allPoints.forEach(function (point) {
        drawPoint(point);
        totalPhotos += point.photos.length;
      });

      document.getElementById("count-trails").textContent = allTrails.length;
      document.getElementById("count-points").textContent = allPoints.length;
      document.getElementById("count-photos").textContent = totalPhotos;

      fitMapToData();
      renderSidebarList();
    }

    function isTrailGeometry(geometry) {
      return geometry.type === "LineString" || geometry.type === "MultiLineString";
    }

    function normalizeTrail(feature) {
      const props = feature.properties || {};
      const geometry = feature.geometry || {};
      const title = getTitle(props);

      if (isCameraText(title)) {
        return null;
      }

      const lines = geometryToLatLngLines(geometry);

      if (!lines.length) {
        return null;
      }

      return {
        id: feature.id || props.id || title,
        title: title,
        notes: props.notes || "",
        color: props.hexcolor || getStrokeColor(feature) || "#18c964",
        distance: Number(props.distance) || 0,
        totalAscent: Number(props.total_ascent) || 0,
        totalDescent: Number(props.total_descent) || 0,
        movingTime: Number(props.moving_time) || 0,
        totalTime: Number(props.total_time) || 0,
        photos: getPhotosForTitle(title, props.photos || []),
        lines: lines,
        originalFeature: feature,
        layer: null
      };
    }

    function buildPointsFromGeoJson(features) {
      const points = [];

      features.forEach(function (feature) {
        const props = feature.properties || {};
        const geometry = feature.geometry || {};

        if (geometry.type === "Point") {
          const title = getTitle(props);

          if (!isCameraText(title)) {
            const coords = geometry.coordinates || [];
            const lng = Number(coords[0]);
            const lat = Number(coords[1]);

            if (Number.isFinite(lat) && Number.isFinite(lng)) {
              points.push({
                id: feature.id || props.id || title,
                title: title,
                notes: props.notes || "",
                lat: lat,
                lng: lng,
                elevation: props.elevation,
                photos: getPhotosForTitle(title, props.photos || []),
                source: "point",
                layer: null
              });
            }
          }
        }

        const photoPoints = Array.isArray(props.photos) ? props.photos : [];

        photoPoints.forEach(function (photo) {
          if (photo.deleted === true) {
            return;
          }

          const photoTitle = photo.title || getTitle(props);

          if (isCameraText(photoTitle)) {
            return;
          }

          const lat = Number(photo.latitude);
          const lng = Number(photo.longitude);

          if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
            return;
          }

          const photosForPoint = getPhotosForTitle(photoTitle, [photo]);

          points.push({
            id: photo.id || photoTitle + "-" + lat + "-" + lng,
            title: photoTitle,
            notes: photo.notes || "",
            lat: lat,
            lng: lng,
            elevation: photo.elevation,
            photos: photosForPoint,
            source: "photo",
            parentTrail: getTitle(props),
            layer: null
          });
        });
      });

      return mergeNearbyPoints(points);
    }

    function mergeNearbyPoints(points) {
      const grouped = [];

      points.forEach(function (point) {
        const existing = grouped.find(function (item) {
          return item.title === point.title &&
            Math.abs(item.lat - point.lat) < 0.00004 &&
            Math.abs(item.lng - point.lng) < 0.00004;
        });

        if (existing) {
          point.photos.forEach(function (photo) {
            if (!existing.photos.some(function (existingPhoto) {
              return existingPhoto.url === photo.url;
            })) {
              existing.photos.push(photo);
            }
          });
        } else {
          grouped.push(point);
        }
      });

      return grouped;
    }

    function geometryToLatLngLines(geometry) {
      if (!geometry || !geometry.coordinates) {
        return [];
      }

      if (geometry.type === "LineString") {
        const line = coordinatesToLatLngs(geometry.coordinates);
        return line.length ? [line] : [];
      }

      if (geometry.type === "MultiLineString") {
        return geometry.coordinates
          .map(coordinatesToLatLngs)
          .filter(function (line) {
            return line.length > 1;
          });
      }

      return [];
    }

    function coordinatesToLatLngs(coordinates) {
      return coordinates
        .map(function (coord) {
          const lng = Number(coord[0]);
          const lat = Number(coord[1]);

          if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
            return null;
          }

          return [lat, lng];
        })
        .filter(Boolean);
    }

    function drawTrail(trail) {
      const layerGroup = L.layerGroup();

      trail.lines.forEach(function (latlngs) {
        L.polyline(latlngs, {
          color: trail.color,
          weight: 5,
          opacity: 0.92,
          lineCap: "round",
          lineJoin: "round"
        }).addTo(layerGroup);

        L.polyline(latlngs, {
          color: "#ffffff",
          weight: 1.5,
          opacity: 0.75,
          lineCap: "round",
          lineJoin: "round"
        }).addTo(layerGroup);
      });

      layerGroup.bindPopup(buildTrailPopup(trail), {
        closeButton: true,
        autoPan: true
      });

      layerGroup.on("mouseover", function () {
        layerGroup.openPopup();
      });

      layerGroup.on("click", function () {
        focusTrail(trail);
      });

      layerGroup.addTo(trailsLayer);
      trail.layer = layerGroup;
    }

    function drawPoint(point) {
      const marker = L.marker([point.lat, point.lng], {
        icon: L.divIcon({
          className: "",
          html: '<div class="poi-marker"></div>',
          iconSize: [18, 18],
          iconAnchor: [9, 9],
          popupAnchor: [0, -9]
        }),
        title: point.title
      });

      marker.bindPopup(buildPointPopup(point), {
        closeButton: false,
        autoPan: true
      });

      marker.on("mouseover", function () {
        marker.openPopup();
      });

      marker.on("mouseout", function () {
        window.setTimeout(function () {
          marker.closePopup();
        }, 250);
      });

      marker.on("click", function () {
        map.setView([point.lat, point.lng], Math.max(map.getZoom(), 18));
        marker.openPopup();
      });

      marker.addTo(pointsLayer);
      point.layer = marker;
    }

    function buildTrailPopup(trail) {
      const photoHtml = buildPhotoHtml(trail.photos);
      const distance = trail.distance ? formatDistance(trail.distance) : "Sin distancia registrada";
      const ascent = trail.totalAscent ? Math.round(trail.totalAscent) + " m de ascenso" : "Ascenso no registrado";
      const time = trail.movingTime ? formatDuration(trail.movingTime) + " en movimiento" : "Tiempo no registrado";

      return [
        '<article class="popup">',
          '<div class="popup-header">',
            '<p class="popup-kicker">Sendero / Transecto</p>',
            '<h3 class="popup-title">' + escapeHtml(trail.title) + '</h3>',
          '</div>',
          '<div class="popup-body">',
            '<p>' + escapeHtml(distance) + " · " + escapeHtml(ascent) + '</p>',
            '<p>' + escapeHtml(time) + '</p>',
            trail.notes ? '<p>' + escapeHtml(trail.notes) + '</p>' : '',
            photoHtml,
          '</div>',
        '</article>'
      ].join("");
    }

    function buildPointPopup(point) {
      const photoHtml = buildPhotoHtml(point.photos);
      const elevation = point.elevation !== null && point.elevation !== undefined && point.elevation !== ""
        ? Math.round(Number(point.elevation)) + " m s. n. m."
        : "Elevación no registrada";

      return [
        '<article class="popup">',
          '<div class="popup-header">',
            '<p class="popup-kicker">Punto de interés</p>',
            '<h3 class="popup-title">' + escapeHtml(point.title) + '</h3>',
          '</div>',
          '<div class="popup-body">',
            '<p>' + escapeHtml(elevation) + '</p>',
            point.parentTrail ? '<p>Relacionado con: ' + escapeHtml(point.parentTrail) + '</p>' : '',
            point.notes ? '<p>' + escapeHtml(point.notes) + '</p>' : '',
            photoHtml,
          '</div>',
        '</article>'
      ].join("");
    }

    function buildPhotoHtml(photos) {
      if (!photos.length) {
        return '<p class="popup-photo-note">Fotos pendientes. Puedes agregarlas luego en PHOTO_LIBRARY usando este mismo título.</p>';
      }

      const images = photos.slice(0, 4).map(function (photo) {
        return '<img src="' + escapeAttribute(photo.url) + '" alt="' + escapeAttribute(photo.alt || "Foto del punto de interés") + '" loading="lazy">';
      }).join("");

      return '<div class="popup-photos">' + images + '</div>';
    }

    function getPhotosForTitle(title, geoJsonPhotos) {
      const manualPhotos = Array.isArray(PHOTO_LIBRARY[title]) ? PHOTO_LIBRARY[title] : [];

      if (manualPhotos.length) {
        return manualPhotos.map(function (url, index) {
          return {
            url: url,
            alt: title + " foto " + (index + 1)
          };
        });
      }

      return geoJsonPhotos
        .filter(function (photo) {
          return photo && photo.deleted !== true && !isCameraText(photo.title || "");
        })
        .map(function (photo) {
          const url = photo.web_url || photo.scaled_url || photo.thumbnail_url || photo.fullsize_url || photo.url;

          if (!url) {
            return null;
          }

          return {
            url: url,
            alt: photo.title || title
          };
        })
        .filter(Boolean);
    }

    function setTab(tabName) {
      currentTab = tabName;

      const trailsTab = document.getElementById("tab-trails");
      const pointsTab = document.getElementById("tab-points");

      trailsTab.classList.toggle("active", tabName === "trails");
      pointsTab.classList.toggle("active", tabName === "points");

      trailsTab.setAttribute("aria-selected", tabName === "trails" ? "true" : "false");
      pointsTab.setAttribute("aria-selected", tabName === "points" ? "true" : "false");

      renderSidebarList();
    }

    function renderSidebarList() {
      const list = document.getElementById("feature-list");
      const searchInput = document.getElementById("search-input");
      const searchValue = searchInput.value.trim().toLowerCase();

      const source = currentTab === "trails" ? allTrails : allPoints;

      const filtered = source.filter(function (item) {
        const title = String(item.title || "").toLowerCase();
        const notes = String(item.notes || "").toLowerCase();
        const parentTrail = String(item.parentTrail || "").toLowerCase();

        return !searchValue ||
          title.includes(searchValue) ||
          notes.includes(searchValue) ||
          parentTrail.includes(searchValue);
      });

      if (!filtered.length) {
        list.innerHTML = '<div class="empty-state">No hay elementos que coincidan con la búsqueda actual.</div>';
        return;
      }

      list.innerHTML = "";

      filtered.forEach(function (item) {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "feature-row";

        if (currentTab === "trails") {
          row.innerHTML = buildTrailRow(item);
          row.addEventListener("click", function () {
            focusTrail(item);
          });
        } else {
          row.innerHTML = buildPointRow(item);
          row.addEventListener("click", function () {
            focusPoint(item);
          });
        }

        list.appendChild(row);
      });
    }

    function buildTrailRow(trail) {
      return [
        '<div class="feature-row-title">',
          '<span>' + escapeHtml(trail.title) + '</span>',
          '<span class="feature-color" style="background:' + escapeAttribute(trail.color) + '"></span>',
        '</div>',
        '<div class="feature-meta">',
          '<span><i class="fa-solid fa-route"></i>Ruta / Transecto</span>',
          trail.distance ? '<span><i class="fa-solid fa-ruler-horizontal"></i>' + escapeHtml(formatDistance(trail.distance)) + '</span>' : '',
          trail.photos.length ? '<span><i class="fa-regular fa-image"></i>' + trail.photos.length + ' fotos</span>' : '',
        '</div>'
      ].join("");
    }

    function buildPointRow(point) {
      const elevation = point.elevation !== null && point.elevation !== undefined && point.elevation !== ""
        ? Math.round(Number(point.elevation)) + " m"
        : "Sin elevación";

      return [
        '<div class="feature-row-title">',
          '<span>' + escapeHtml(point.title) + '</span>',
          '<span class="feature-color point" style="background: var(--cyan)"></span>',
        '</div>',
        '<div class="feature-meta">',
          '<span><i class="fa-solid fa-location-dot"></i>' + escapeHtml(elevation) + '</span>',
          point.parentTrail ? '<span><i class="fa-solid fa-route"></i>' + escapeHtml(point.parentTrail) + '</span>' : '',
          point.photos.length ? '<span><i class="fa-regular fa-image"></i>' + point.photos.length + ' fotos</span>' : '',
        '</div>'
      ].join("");
    }

    function focusTrail(trail) {
      if (!trail.layer) {
        return;
      }

      const bounds = L.latLngBounds([]);

      trail.lines.forEach(function (line) {
        line.forEach(function (latlng) {
          bounds.extend(latlng);
        });
      });

      if (bounds.isValid()) {
        map.fitBounds(bounds, {
          padding: [36, 36],
          maxZoom: 18
        });
      }

      trail.layer.openPopup();
    }

    function focusPoint(point) {
      if (!point.layer) {
        return;
      }

      map.setView([point.lat, point.lng], Math.max(map.getZoom(), 18));
      point.layer.openPopup();
    }

    function fitMapToData() {
      const bounds = L.latLngBounds([]);

      allTrails.forEach(function (trail) {
        trail.lines.forEach(function (line) {
          line.forEach(function (latlng) {
            bounds.extend(latlng);
          });
        });
      });

      allPoints.forEach(function (point) {
        bounds.extend([point.lat, point.lng]);
      });

      if (bounds.isValid()) {
        map.fitBounds(bounds, {
          padding: [30, 30]
        });
      }
    }

    function getTitle(props) {
      return props.title || props.name || props.id || "Sin nombre";
    }

    function getStrokeColor(feature) {
      if (feature.style && feature.style.stroke) {
        return feature.style.stroke;
      }

      if (feature.properties && feature.properties.marker_color) {
        return feature.properties.marker_color;
      }

      return null;
    }

    function isCameraText(value) {
      const text = String(value || "").toLowerCase();

      return CAMERA_WORDS.some(function (word) {
        return text.includes(word);
      });
    }

    function formatDistance(meters) {
      const value = Number(meters) || 0;

      if (value >= 1000) {
        return (value / 1000).toFixed(2) + " km";
      }

      return Math.round(value) + " m";
    }

    function formatDuration(seconds) {
      const totalSeconds = Math.max(0, Number(seconds) || 0);
      const minutes = Math.round(totalSeconds / 60);

      if (minutes < 60) {
        return minutes + " min";
      }

      const hours = Math.floor(minutes / 60);
      const remainingMinutes = minutes % 60;

      return hours + " h " + remainingMinutes + " min";
    }

    function showMessage(message) {
      const element = document.getElementById("map-message");
      element.textContent = message;
      element.classList.add("is-visible");
    }

    function hideMessage() {
      const element = document.getElementById("map-message");
      element.classList.remove("is-visible");
      element.textContent = "";
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<​", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replaceAll("`", "&#096;");
    }
  </script>
</body>
</html>
